apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ipam-runtime
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  sourceRef:
    kind: OCIRepository
    name: ipam
  path: ./base
  images:
    - name: ghcr.io/milo-os/ipam
      digest: sha256:9811093733ccc8e0e56ab86ba959dda73d8035a08a6feb7d3a91c5cd10011a3e
  patches:
    - target:
        group: apps
        version: v1
        kind: Deployment
        name: ipam-apiserver
      patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ipam-apiserver
        spec:
          replicas: 1
          template:
            spec:
              containers:
                - name: apiserver
                  env:
                    - name: ENABLE_QUOTA
                      value: "false"
              volumes:
                - name: tls-certs
                  csi:
                    volumeAttributes:
                      csi.cert-manager.io/issuer-name: ipam-ca-issuer
                      csi.cert-manager.io/issuer-kind: Issuer
    - target:
        group: networking.k8s.io
        version: v1
        kind: NetworkPolicy
        name: ipam-apiserver
      patch: |-
        - op: add
          path: /spec/ingress/0/from/-
          value:
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: milo-system
        - op: add
          path: /spec/egress/-
          value:
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0
            ports:
              - protocol: TCP
                port: 6443
              - protocol: TCP
                port: 443
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: ipam-apiserver
      namespace: ipam-system
