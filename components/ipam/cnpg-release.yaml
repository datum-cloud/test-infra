apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 10m
  timeout: 10m
  releaseName: cnpg
  chartRef:
    kind: OCIRepository
    name: cnpg
    namespace: cnpg-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 512Mi
  # Chart 0.29.0 renders its appVersion as a tag. Pin the final Deployment
  # image to the observed multi-platform index digest instead.
  postRenderers:
    - kustomize:
        images:
          - name: ghcr.io/cloudnative-pg/cloudnative-pg
            digest: sha256:a2701eb97cdd2a34b1fdb2cb51987f544b706e40bec72ae7146cd8580efefebb
