apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Gateway API experimental CRDs – must match the version bundled in the
  # Envoy Gateway chart (see ../oci-repository.yaml for the EG version).
  # EG v1.8.1 bundles Gateway API v1.5.1 and requires TLSRoute at v1
  # (promoted from v1alpha2/v1alpha3 in v1.4.x).  Helm does not upgrade CRDs
  # on helm-upgrade, so we apply them explicitly before the HelmRelease.
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/experimental-install.yaml
