apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: compute-a1t-hub-nso-crds
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  sourceRef:
    kind: GitRepository
    name: compute-a1t-hub-nso-source
  path: ./config/crd/downstream
  kubeConfig:
    secretRef:
      name: compute-a1t-hub-crd-installer-kubeconfig
      key: kubeconfig
