apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: compute-a1t-karmada-rbac
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  prune: true
  sourceRef:
    kind: GitRepository
    name: compute-a1t-controller
  path: ./config/base/downstream-rbac
  kubeConfig:
    secretRef:
      name: apps-a1t-karmada-rbac-bootstrap-kubeconfig
      key: kubeconfig
  patches:
    - target:
        group: rbac.authorization.k8s.io
        version: v1
        kind: ClusterRoleBinding
        name: compute-manager
      patch: |-
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: compute-manager
        subjects:
          - kind: User
            name: apps-a1t-compute-manager
