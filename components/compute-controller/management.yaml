apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: compute-a1t-management
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  dependsOn:
    - name: compute-a1t-milo-api-crds
      namespace: milo-system
  sourceRef:
    kind: GitRepository
    name: compute-a1t-controller
  path: ./config/overlays/management-plane
  images:
    - name: ghcr.io/datum-cloud/compute
      digest: sha256:1e213d5dcff0be340788d80df6fbdc235b691830667526234ee131240a89e679
  # The upstream management overlay is the controller source of truth. These
  # are the only omitted upstream resources: optional observability CRs and
  # their generated JSON ConfigMaps, which this test cluster does not install.
  patches:
    - target:
        group: grafana.integreatly.org
        version: v1beta1
        kind: GrafanaDashboard
        name: compute-shell-sessions
      patch: |-
        apiVersion: grafana.integreatly.org/v1beta1
        kind: GrafanaDashboard
        metadata:
          name: compute-shell-sessions
        $patch: delete
    - target:
        group: grafana.integreatly.org
        version: v1beta1
        kind: GrafanaDashboard
        name: compute-overview
      patch: |-
        apiVersion: grafana.integreatly.org/v1beta1
        kind: GrafanaDashboard
        metadata:
          name: compute-overview
        $patch: delete
    - target:
        group: operator.victoriametrics.com
        version: v1beta1
        kind: VMRule
        name: compute-controller-alerts
      patch: |-
        apiVersion: operator.victoriametrics.com/v1beta1
        kind: VMRule
        metadata:
          name: compute-controller-alerts
        $patch: delete
    - target:
        group: operator.victoriametrics.com
        version: v1beta1
        kind: VMRule
        name: compute-shell-session-alerts
      patch: |-
        apiVersion: operator.victoriametrics.com/v1beta1
        kind: VMRule
        metadata:
          name: compute-shell-session-alerts
        $patch: delete
    - target:
        version: v1
        kind: ConfigMap
        name: compute-shell-sessions-dashboard
      patch: |-
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: compute-shell-sessions-dashboard
        $patch: delete
    - target:
        version: v1
        kind: ConfigMap
        name: compute-overview-dashboard
      patch: |-
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: compute-overview-dashboard
        $patch: delete
    # The management deployment needs a real Karmada-hub credential because
    # PR32 keeps the hub in a separate cluster. The mounted Secret is provisioned
    # by the isolated test bootstrap and is never copied from either cluster's
    # administrator kubeconfig.
    - target:
        group: apps
        version: v1
        kind: Deployment
        name: compute-manager
      patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: compute-manager
        spec:
          template:
            spec:
              volumes:
                - name: downstream-kubeconfig
                  configMap: null
                  secret:
                    secretName: compute-a1t-karmada-kubeconfig
                    defaultMode: 0400
                    items:
                      - key: kubeconfig
                        path: downstream-kubeconfig.yaml
                - name: karmada-token
                  $patch: delete
                - name: quota-credentials
                  projected:
                    sources:
                      - secret:
                          name: compute-a1t-quota-client
                          items:
                            - key: ca.crt
                              path: ca.crt
                            - key: tls.crt
                              path: tls.crt
                            - key: tls.key
                              path: tls.key
                      - configMap:
                          name: compute-a1t-quota-kubeconfig
                          items:
                            - key: kubeconfig
                              path: kubeconfig
              containers:
                - name: manager
                  volumeMounts:
                    - name: quota-credentials
                      mountPath: /etc/quota-credentials
                      readOnly: true
    - target:
        version: v1
        kind: ConfigMap
        name: compute-config
      patch: |-
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: compute-config
        data:
          config.yaml: |
            apiVersion: apiserver.config.datumapis.com/v1alpha1
            kind: WorkloadOperator
            metricsServer:
              bindAddress: "0"
            webhookServer: {}
            discovery:
              mode: milo
              clusterName: apps-a1t-pop-dfw-20261020
              quotaKubeconfigPath: /etc/quota-credentials/kubeconfig
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: compute-manager
      namespace: compute-system
    - apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingWebhookConfiguration
      name: compute-mutating
    - apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingWebhookConfiguration
      name: compute-validating
