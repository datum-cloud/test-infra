apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apps-a1t-compute-project-discovery
rules:
  - apiGroups:
      - resourcemanager.miloapis.com
    resources:
      - projects
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apps-a1t-compute-project-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apps-a1t-compute-project-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: apps-a1t-compute-discovery
