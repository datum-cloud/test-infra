apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-native-a1t-admission
  namespace: milo-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  dependsOn:
    - name: apps-native-a1t-host
      namespace: flux-system
  sourceRef:
    kind: OCIRepository
    name: apps-native-a1t
    namespace: flux-system
  path: ./config/overlays/test-infra/milo-admission
  kubeConfig:
    secretRef:
      name: apps-native-a1t-milo-installer
      key: kubeconfig
  # The runner injects only the observed public CA into the source-owned hooks
  # as spec.patches before this Kustomization is created.
