apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-native-a1t-host
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: true
  dependsOn:
    - name: apps-native-a1t-crds
      namespace: milo-system
  sourceRef:
    kind: OCIRepository
    name: apps-native-a1t
    namespace: flux-system
  path: ./config/overlays/test-infra/host
  images:
    - name: ghcr.io/datum-labs/apps
      digest: sha256:8eb09c545ba3f1e8f1a7eddb9f5667ae914786cf4da1d63a21cd38ef7652e610
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: apps-controller
      namespace: apps-system
