apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apps-a1t-native-discovery
rules:
  - apiGroups: [resourcemanager.miloapis.com]
    resources: [projects]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apps-a1t-native-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apps-a1t-native-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: apps-a1t-native-discovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apps-a1t-native-project
rules:
  - apiGroups: [apps.miloapis.com]
    resources: [apptemplates]
    verbs: [get, list, watch, patch]
  - apiGroups: [apps.miloapis.com]
    resources: [apptemplates/status]
    verbs: [update]
  - apiGroups: [apps.miloapis.com]
    resources: [apptemplaterevisions]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apps-a1t-native-project
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apps-a1t-native-project
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: apps-a1t-native-project
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apps-a1t-native-author
rules:
  - apiGroups: [apps.miloapis.com]
    resources: [apptemplates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps.miloapis.com]
    resources: [apptemplaterevisions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apps-a1t-native-author
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apps-a1t-native-author
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: apps-a1t-native-author
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apps-a1t-native-installer
rules:
  # Kubernetes RBAC cannot constrain create by resourceName. This short-lived
  # installer is never mounted into the Apps manager or customer client.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [create]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames:
      - apptemplates.apps.miloapis.com
      - apptemplaterevisions.apps.miloapis.com
    verbs: [get, patch, delete]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [create]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    resourceNames: [apps-templates.apps.miloapis.com]
    verbs: [get, patch, delete]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    verbs: [create]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    resourceNames: [apps-authoring.apps.miloapis.com]
    verbs: [get, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apps-a1t-native-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apps-a1t-native-installer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: apps-a1t-native-installer
