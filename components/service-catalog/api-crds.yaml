apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: service-catalog-api-crds
  namespace: milo-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  prune: true
  dependsOn:
    - name: milo-core
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: service-catalog
    namespace: flux-system
  # This upstream overlay also installs the pinned Locations schemas and the
  # admission webhook configurations consumed by the operator.
  path: ./config/overlays/e2e-milo/milo-resources
  kubeConfig:
    secretRef:
      name: apps-a1t-catalog-installer-kubeconfig
      key: kubeconfig
  healthChecks:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: services.services.miloapis.com
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: serviceentitlements.services.miloapis.com
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: locations.locations.miloapis.com
