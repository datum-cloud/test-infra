apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: service-catalog-operator-rbac
  namespace: milo-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  prune: true
  dependsOn:
    - name: service-catalog-api-crds
  sourceRef:
    kind: GitRepository
    name: service-catalog
    namespace: flux-system
  path: ./config/components/controller_rbac
  kubeConfig:
    secretRef:
      name: milo-controller-manager-kubeconfig
      key: kubeconfig
  # The upstream component binds its ClusterRole to a Kubernetes
  # ServiceAccount. In this test topology the operator runs in the host kind
  # cluster and authenticates to Milo as a dedicated static-token User.
  patches:
    - target:
        group: rbac.authorization.k8s.io
        version: v1
        kind: ClusterRoleBinding
        name: services-controller-manager
      patch: |-
        - op: replace
          path: /subjects
          value:
            - apiGroup: rbac.authorization.k8s.io
              kind: User
              name: apps-a1t-services-operator
  healthChecks:
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      name: services-controller-manager
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      name: services-controller-manager
