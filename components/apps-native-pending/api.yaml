apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-native-a1t-pending-api
  namespace: milo-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  sourceRef:
    kind: OCIRepository
    name: apps-native-a1t
    namespace: flux-system
  path: ./config/experimental/pending-app-api
  kubeConfig:
    secretRef:
      name: apps-native-a1t-milo-installer
      key: kubeconfig
  healthChecks:
  - apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: apps.apps.miloapis.com
  - apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: apprevisions.apps.miloapis.com
