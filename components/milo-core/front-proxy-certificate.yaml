apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: milo-front-proxy-client
  namespace: milo-system
spec:
  secretName: milo-front-proxy-client
  duration: 8760h
  commonName: milo-front-proxy-client
  usages:
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    name: milo-ca-issuer
    kind: Issuer
    group: cert-manager.io
