apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - bootstrap-namespace.yaml
  - source.yaml
  - resource-metrics-source.yaml
  # The aggregator needs a client identity before it can proxy project requests
  # to extension API servers such as IPAM.
  - front-proxy-certificate.yaml
  - core.yaml
  - infra-crds.yaml
  - api-crd.yaml
  - api-users.yaml
  - api-webhooks.yaml
  - api-services.yaml
