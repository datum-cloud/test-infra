apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: milo-infra-crds
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  prune: true
  dependsOn:
    - name: milo-core
  sourceRef:
    kind: GitRepository
    name: milo
  path: ./config/crd/overlays/infra-control-plane
  healthChecks:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: projectcontrolplanes.infrastructure.miloapis.com
