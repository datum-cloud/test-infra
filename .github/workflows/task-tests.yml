name: task-tests
on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main

jobs:
  hack-tests:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Run every task test in hack/
        run: |
          set -euo pipefail
          for t in hack/*.test.sh; do
            echo "== $t"
            bash "$t"
          done
