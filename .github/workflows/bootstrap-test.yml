name: bootstrap-kind-test
on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Bootstrap KIND cluster
        id: bootstrap
        uses: ./.github/actions/kind-bootstrap
        with:
          cluster_name: test-infra
          wait_timeout: 240s
          test_infra_ref: ${{ github.sha }}

      - name: Smoke-check cluster
        run: kubectl get pods -A

      - name: Exercise Gateway HTTPRoute data path
        working-directory: test-infra
        env:
          GATEWAY_SMOKE_CONTEXT: kind-test-infra
          GATEWAY_SMOKE_IMAGE: docker.io/library/nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          GATEWAY_SMOKE_DIAG_DIR: ${{ github.workspace }}/diagnostics/gateway-smoke
        run: bash hack/test-gateway-route.sh

      - name: Reconcile pinned Milo and probe its API
        working-directory: test-infra
        env:
          MILO_FLUX_CONTEXT: kind-test-infra
          MILO_FLUX_DIAG_DIR: ${{ github.workspace }}/diagnostics/milo-flux
        run: bash hack/test-milo-flux.sh

      - name: Capture bootstrap and Flux diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          kind get clusters > diagnostics/kind-clusters.txt 2>&1 || true
          if [ -f test-infra/kubeconfig ]; then
            export KUBECONFIG="$PWD/test-infra/kubeconfig"
            kubectl get nodes,pods -A -o wide > diagnostics/cluster.txt 2>&1 || true
            kubectl get gitrepositories,ocirepositories,kustomizations,helmreleases -A -o yaml > diagnostics/flux.yaml 2>&1 || true
            kubectl get gateways,httproutes -A -o yaml > diagnostics/routes.yaml 2>&1 || true
            kubectl get events -A --sort-by=.lastTimestamp > diagnostics/events.txt 2>&1 || true
          fi

      - name: Delete only the CI kind cluster
        if: always()
        run: |
          if kind get clusters | grep -Fxq test-infra; then
            kind delete cluster --name test-infra > diagnostics/cleanup.txt 2>&1
          else
            echo "test-infra cluster was not present" > diagnostics/cleanup.txt
          fi
          kind get clusters >> diagnostics/cleanup.txt 2>&1 || true

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-kind-diagnostics
          path: diagnostics/
