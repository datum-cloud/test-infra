name: bootstrap-kind-test
on:
  pull_request:
    branches: [ main ]        
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      # The images below are multi-platform. Docker 29's containerd image store keeps only the host's platform of them,
      # so `kind load docker-image` fails on the missing blobs (kubernetes-sigs/kind#3795). kind's Known Issues names
      # turning the store off: https://kind.sigs.k8s.io/docs/user/known-issues/#unable-to-kind-load-docker-images
      # It is done here, in this repository's own job, and not in the shared kind-bootstrap action, because a caller may
      # prepare images in the store before it calls the action, and a restart into another store would hide them.
      - name: Use Docker's classic image store
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/docker
          cfg='{}'
          if sudo test -s /etc/docker/daemon.json; then cfg=$(sudo cat /etc/docker/daemon.json); fi
          echo "$cfg" | jq '.features["containerd-snapshotter"] = false' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          docker info --format 'Docker storage: {{ .Driver }} {{ .DriverStatus }}'
          if docker info --format '{{ .DriverStatus }}' | grep -q io.containerd.snapshotter; then
            echo "the containerd image store is still on"
            exit 1
          fi

      - name: Bootstrap KIND cluster
        id: bootstrap
        uses: ./.github/actions/kind-bootstrap
        with:
          cluster_name: test-infra
          wait_timeout: 240s
          test_infra_ref: ${{ github.sha }}

      - name: Smoke-check cluster
        run: kubectl get pods -A

      - name: Exercise Gateway HTTPRoute data path
        working-directory: test-infra
        env:
          GATEWAY_SMOKE_CONTEXT: kind-test-infra
          GATEWAY_SMOKE_IMAGE: docker.io/library/nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          GATEWAY_SMOKE_DIAG_DIR: ${{ github.workspace }}/diagnostics/gateway-smoke
        run: bash hack/test-gateway-route.sh

      - name: Capture bootstrap and Flux diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          kind get clusters > diagnostics/kind-clusters.txt 2>&1 || true
          if [ -f test-infra/kubeconfig ]; then
            export KUBECONFIG="$PWD/test-infra/kubeconfig"
            kubectl get nodes,pods -A -o wide > diagnostics/cluster.txt 2>&1 || true
            kubectl get gitrepositories,ocirepositories,kustomizations,helmreleases -A -o yaml > diagnostics/flux.yaml 2>&1 || true
            kubectl get gateways,httproutes -A -o yaml > diagnostics/routes.yaml 2>&1 || true
            kubectl get events -A --sort-by=.lastTimestamp > diagnostics/events.txt 2>&1 || true
          fi

      - name: Delete only the CI kind cluster
        if: always()
        run: |
          if kind get clusters | grep -Fxq test-infra; then
            kind delete cluster --name test-infra > diagnostics/cleanup.txt 2>&1
          else
            echo "test-infra cluster was not present" > diagnostics/cleanup.txt
          fi
          kind get clusters >> diagnostics/cleanup.txt 2>&1 || true

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-kind-diagnostics
          path: diagnostics/
