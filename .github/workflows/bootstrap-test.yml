name: bootstrap-kind-test
on:
  pull_request:
    branches: [ main ]        
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      # The images below are multi-platform. Docker 29's containerd image store keeps only the host's platform of them,
      # so `kind load docker-image` fails on the missing blobs (kubernetes-sigs/kind#3795). kind's Known Issues names
      # turning the store off: https://kind.sigs.k8s.io/docs/user/known-issues/#unable-to-kind-load-docker-images
      # It is done here, in this repository's own job, and not in the shared kind-bootstrap action, because a caller may
      # prepare images in the store before it calls the action, and a restart into another store would hide them.
      - name: Use Docker's classic image store
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/docker
          cfg='{}'
          if sudo test -s /etc/docker/daemon.json; then cfg=$(sudo cat /etc/docker/daemon.json); fi
          echo "$cfg" | jq '.features["containerd-snapshotter"] = false' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          docker info --format 'Docker storage: {{ .Driver }} {{ .DriverStatus }}'
          if docker info --format '{{ .DriverStatus }}' | grep -q io.containerd.snapshotter; then
            echo "the containerd image store is still on"
            exit 1
          fi

      - name: Bootstrap KIND cluster
        id: bootstrap
        uses: ./.github/actions/kind-bootstrap
        with:
          cluster_name: test-infra
          wait_timeout: 240s
          images: |
            nginx:1.27-alpine
            busybox:latest

      - name: Verify images pre-loaded on every node
        run: |
          set -euo pipefail
          CLUSTER=test-infra
      
          # Exactly what you asked KIND to load
          IMAGES=(
            "docker.io/library/nginx:1.27-alpine"
            "docker.io/library/busybox:latest"
          )
      
          for node in $(kind get nodes --name "$CLUSTER"); do
            # Build a simple newline-separated list: repo:tag
            image_list=$(docker exec "$node" crictl images \
                            | awk 'NR>1 {print $1 ":" $2}')   # skip header
      
            for img in "${IMAGES[@]}"; do
              if grep -qx "$img" <<<"$image_list"; then
                echo "✅ $img present on $node"
              else
                echo "❌ $img missing on $node"
                exit 1
              fi
            done
          done

      - name: Smoke-check cluster
        run: kubectl get pods -A
