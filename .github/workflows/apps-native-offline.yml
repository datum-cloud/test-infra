permissions:
  contents: read

jobs:
  harness-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
      - name: Install pinned Python test dependency
        run: python -m pip install --disable-pip-version-check --no-deps PyYAML==6.0.3
      - name: Install digest-verified native render tools
        run: |
          bash hack/install-apps-native-ci-tools.sh "$RUNNER_TEMP/apps-native-offline-tools"
          echo "$RUNNER_TEMP/apps-native-offline-tools" >> "$GITHUB_PATH"
      - name: Run native Apps offline harness regression
        run: task test-apps-native-offline
