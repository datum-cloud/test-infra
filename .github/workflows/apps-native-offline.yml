name: apps-native-offline

on:
  pull_request:
    paths:
      - .github/workflows/apps-native-offline.yml
      - Taskfile.yml
      - components/apps-native-kata/**
      - components/apps-native-kata-netns/**
      - components/apps-native-kata-runtimeclass-project/**
      - docs/apps-native-kata-prerequisite.md
      - docs/apps-kata-netns-followup.md
      - hack/check_native_kata_prerequisite.py
      - hack/render_kata_netns_candidate.py
      - hack/test_kata_netns_candidate.py
      - hack/render_runtimeclass_project_candidate.py
      - hack/test_runtimeclass_project_candidate.py
      - hack/test_native_kata_prerequisite.py
      - components/apps-native/**
      - hack/apps_native_support.py
      - hack/test-apps-native-authoring.py
      - hack/test_apps_native_harness.py
      - hack/apps_native_guard_quota.py
      - hack/test_apps_native_guard_quota.py
      - hack/test_apps_native_flux_prune.py
      - hack/apps_native_cli/**
      - hack/install-apps-native-ci-tools.sh
      - hack/bootstrap-apps-native-projects.py
      - hack/test_bootstrap_apps_native_projects.py
      - hack/check-apps-native-ci-capacity.py
      - hack/test_apps_native_ci_capacity.py
      - .github/workflows/apps-native-authoring.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/apps-native-offline.yml
      - Taskfile.yml
      - components/apps-native-kata/**
      - components/apps-native-kata-netns/**
      - components/apps-native-kata-runtimeclass-project/**
      - docs/apps-native-kata-prerequisite.md
      - docs/apps-kata-netns-followup.md
      - hack/check_native_kata_prerequisite.py
      - hack/render_kata_netns_candidate.py
      - hack/test_kata_netns_candidate.py
      - hack/render_runtimeclass_project_candidate.py
      - hack/test_runtimeclass_project_candidate.py
      - hack/test_native_kata_prerequisite.py
      - components/apps-native/**
      - hack/apps_native_support.py
      - hack/test-apps-native-authoring.py
      - hack/test_apps_native_harness.py
      - hack/apps_native_guard_quota.py
      - hack/test_apps_native_guard_quota.py
      - hack/test_apps_native_flux_prune.py
      - hack/apps_native_cli/**
      - hack/install-apps-native-ci-tools.sh
      - hack/bootstrap-apps-native-projects.py
      - hack/test_bootstrap_apps_native_projects.py
      - hack/check-apps-native-ci-capacity.py
      - hack/test_apps_native_ci_capacity.py
      - .github/workflows/apps-native-authoring.yml

permissions:
  contents: read

jobs:
  harness-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
      - name: Install pinned Python test dependency
        run: python -m pip install --disable-pip-version-check --no-deps PyYAML==6.0.3
      - name: Run native Apps offline harness regression
        run: task test-apps-native-offline
