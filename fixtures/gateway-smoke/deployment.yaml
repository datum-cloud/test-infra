apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-smoke
  namespace: apps-a1t-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-smoke
  template:
    metadata:
      labels:
        app: gateway-smoke
    spec:
      containers:
        - name: nginx
          image: gateway-smoke-image
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: response
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: response
          configMap:
            name: gateway-smoke-response
